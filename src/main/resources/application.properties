spring.application.name=library-management

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/librarydb?TimeZone=UTC&options=-c+timezone=UTC
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8081

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.dat.library_management=DEBUG
logging.level.org.springframework.boot.context.config=TRACE

spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC

# Force JVM timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
java.time.zoneid=UTC